services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://fintax:fintax@db:5432/fintax
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fintax
      POSTGRES_USER: fintax
      POSTGRES_PASSWORD: fintax
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintax -d fintax"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
