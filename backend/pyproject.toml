[project]
name = "fintax-ai-backend"
version = "0.1.0"
description = "FinTax AI API and deterministic tax platform foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14",
  "asyncpg>=0.30",
  "faiss-cpu>=1.9",
  "fastapi>=0.115",
  "google-genai>=1.0",
  "httpx>=0.28",
  "langchain>=0.3",
  "pdfplumber>=0.11",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyjwt[crypto]>=2.10",
  "python-multipart>=0.0.20",
  "slowapi>=0.1.9",
  "sqlalchemy[asyncio]>=2.0",
  "structlog>=25.1",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[tool.coverage.run]
branch = true
source = ["app.services.tax_engine"]

[tool.coverage.report]
fail_under = 95

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiosqlite>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
artifacts = ["app/services/extraction/prompts/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
